cus-visible{outline:3px solid var(--gold);outline-offset:3px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row.spread{justify-content:space-between}label.control{display:block;margin:15px 0}label.control>span{display:block;margin-bottom:7px}input[type=range]{width:100%;accent-color:var(--accent)}input[type=number]{width:125px}textarea{width:100%;min-height:100px;background:#0b1626;border:1px solid #405776;color:var(--ink);border-radius:7px;padding:10px;resize:vertical}svg.viz{display:block;width:100%;height:auto;background:#0b1423;border-radius:8px}svg text{font-family:system-ui,sans-serif;fill:#b8c9df;font-size:12px}svg .axis{fill:none;stroke:#50617b;stroke-width:1}svg .gridline{stroke:#213149;stroke-width:1}svg .label{fill:#eef5ff}.readout{font-variant-numeric:tabular-nums;color:var(--accent);font-size:17px}.status{min-height:26px;margin:10px 0;color:var(--gold)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}details{margin:14px 0}summary{cursor:pointer;color:var(--accent)}.badge{border:1px solid #405776;border-radius:30px;padding:3px 10px;font-size:12px;color:var(--muted)}.stat{padding:12px;background:#0c1728;border-radius:8px;flex:1;min-width:120px}.stat strong{display:block;font-size:20px;color:var(--accent)}.spectrum{cursor:crosshair;touch-action:manipulation}.checkbox{display:inline-flex;gap:6px;align-items:center;margin:6px 12px 6px 0}.reference{font-size:13px}.reference a,a{color:var(--accent)}.answer{margin-top:20px}.starball{width:58px;height:58px;border-radius:50%;box-shadow:0 0 25px #fff5}.hidden{display:none!important}.scroll{overflow:auto}.printOnly{display:none}footer{color:var(--muted);font-size:12px;padding:20px 28px;border-top:1px solid var(--line)}@media(max-width:950px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;padding:12px;gap:8px;position:relative}nav button{width:auto;whi <header><div><div class="eyebrow">Light is evidence</div><h1>Spectral Observatory</h1></div><div class="row"><span class="badge">Offline astronomy laboratory</span><button id="pause" aria-pressed="false">Pause animation</button><button id="notebookTop">Open notebook</button></div></header>
<div class="shell"><nav aria-label="Laboratories" id="nav"></nav><main id="main"></main></div><footer>Classroom models • No accounts, tracking, libraries, or internet connection required. Work stays in this browser; export your notebook before leaving a shared laptop.</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), TAU=2*Math.PI, C=299792.458, rad=d=>d*Math.PI/180;
const E={H:[410.174,434.047,486.133,656.28],He:[402.62,447.15,471.31,492.19,501.57,587.56,667.82],Na:[588.995,589.592],Ne:[540.06,585.25,588.19,594.48,603.0,607.43,614.31,621.73,626.65,633.44,638.30,640.22,650.65,659.90,667.83,671.70,692.95,703.24],Hg:[404.66,435.83,546.07,576.96,579.07]};

const tabs=['Spectrometer','Stars & H–R diagram','Doppler planets','Transits & atmospheres','Galaxy rotation','Cosmic expansion','Composition & nebulae','Binary stars','Notebook & guide'];
let state={tab:0,gas:'H',mode:'emission',ref:'H',unknown:0,mystery:false,zoom:false,T:5800,star:0,classified:[],mass:1,a:1,inc:90,rp:.1,ti:90,atmos:0,mol:[],pred:[],reveal:false,halo:0,radius:4,side:1,rotation:[],galaxy:0,hubble:[],speed:90,motionGas:'He',binaryRatio:.7,binaryInc:75,notes:{},log:[],student:''};
let storageOK=true;try{const saved=JSON.parse(localStorage.getItem('spectral-observatory-v1'));if(saved&&saved.version===1)state={...state,...saved.state,tab:0};}catch(e){storageOK=false}
let phase=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,last=0,frameElapsed=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('spectral-observatory-v1',JSON.stringify({version:1,state}));}catch(e){storageOK=false}}
function record(lab,text){state.log.push({lab,text,time:new Date().toISOString()});save()}
function opts(list,value){return list.map(v=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(names[v]||v)}</option>`).join('')}
function select(id,list,value){return `<select id="${id}">${opts(list,value)}</select>`}
function range(id,label,min,max,step,value,unit=''){return `<label class="control"><span>${label} <b id="${id}Val" class="readout">${value}${unit}</b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}"></label>`}
function bindRange(id,key,fn,unit=''){ $(id).oninput=()=>{state[key]=+$(id).value;$(id+'Val').textContent=state[key]+unit;save();fn()}}
function intro(n,title,text){return `<div class="intro"><div class="eyebrow">Lab ${n} / Observe · measure · explain</div><h2>${title}</h2><p class="muted">${text}</p></div>`}
function note(key,prompt){return `<div class="card answer"><h3>Evidence notebook</h3><label for="note-${key}">${prompt}</label><textarea id="note-${key}" data-note="${key}" placeholder="Use measurements and observations to support your explanation.">${esc(state.notes[key]||'')}</textarea><div class="printOnly">${esc(state.notes[key]||'No explanation recorded.')}</div><small>Saved on this browser when available. Export from the notebook for submission or backup.</small></div>`}
function bindNotes(){document.querySelectorAll('[data-note]').forEach(n=>n.oninput=()=>{state.notes[n.dataset.note]=n.value;save()})}
function svg(content,w=720,h=230,cls=''){return `<svg class="viz ${cls}" viewBox="0 0 ${w} ${h}" role="img">${content}</svg>`}
function title(s){return `<title>${esc(s)}</title>`}
function color(w){let r=0,g=0,b=0;if(w<440){r=(440-w)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=(510-w)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=(645-w)/65}else r=1;return `rgb(${Math.round(255*Math.max(0,Math.min(1,r)))},${Math.round(255*Math.max(0,Math.min(1,g)))},${Math.round(255*Math.max(0,Math.min(1,b)))})`}
function plot(id,series,xmin,xmax,ymin,ymax,xlabel,ylabel,extra='',dots=[]){let W=720,H=280,L=70,R=20,T=25,B=55,X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-B-T),s=title(`${ylabel} versus ${xlabel}`);for(let i=0;i<=4;i++){let x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;s+=`<path class="gridline" d="M${X(x)},${T}V${H-B}M${L},${Y(y)}H${W-R}"/><text x="${X(x)}" y="${H-B+22}" text-anchor="middle">${fmt(x)}</text><text x="${L-10}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`}s+=`<path class="axis" d="M${L},${T}V${H-B}H${W-R}"/><text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle">${xlabel}</text><text transform="translate(17 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${ylabel}</text>`;series.forEach(a=>{s+=`<path d="${a.points.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)}`).join(' ')}" fill="none" stroke="${a.color||'#7ee2d0'}" stroke-width="2.5" ${a.dash?'stroke-dasharray="6 5"':''}/>`});dots.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="${p[3]||'#ffce83'}"/><text x="${X(p[0])+7}" y="${Y(p[1])-8}">${esc(p[2]||'')}</text>`});$(id).innerHTML=svg(s+extra,W,H);return {X,Y}}
function fmt(x){return Math.abs(x)>=10000?x.toExponential(1):Math.abs(x)>=10?x.toFixed(0):+x.toFixed(2)}
function samples(fn,min,max,n=200){return Array.from({length:n+1},(_,i)=>{let x=min+(max-min)*i/n;return [x,fn(x)]})}
// Shared detector: rounded visible air wavelengths; schematic relative line strengths.
function spectrum(id,lines,mode='absorption',cfg={}){let min=cfg.min??380,max=cfg.max??720,W=720,H=170,L=40,R=20,xx=x=>L+(x-min)/(max-min)*(W-L-R),s=title(cfg.label||`${mode} spectrum, ${min} to ${max} nanometers`);if(mode!=='emission'){for(let i=0;i<660;i+=2){let w=min+(max-min)*i/660;s+=`<rect x="${L+i}" y="22" width="2.2" height="70" fill="${color(w)}" opacity=".8"/>`}}else s+=`<rect x="40" y="22" width="660" height="70" fill="#02050a"/>`;lines.forEach((a,i)=>{let w=typeof a==='number'?a:a.w,d=typeof a==='number'?.8:a.d??.8,wd=typeof a==='number'?1.8:a.width??1.8;if(w<min||w>max)return;s+=`<rect x="${xx(w)-wd/2}" y="22" width="${wd}" height="70" opacity="${mode==='emission'?Math.max(.4,d):d}" fill="${mode==='emission'?color(w):'#000'}"/>`;if(cfg.labels)s+=`<text x="${xx(w)}" y="${i%2?13:110}" text-anchor="middle" font-size="10">${w.toFixed(1)}</text>`});for(let i=0;i<=5;i++){let w=min+(max-min)*i/5;s+=`<path class="axis" d="M${xx(w)} 94v6"/><text x="${xx(w)}" y="125" text-anchor="middle">${+w.toFixed(2)}</text>`}s+=`<text x="370" y="154" text-anchor="middle">Wavelength (nm) · click detector to measure</text>`;$(id).innerHTML=svg(s,W,H,'spectrum')+`<div class="muted" id="${id}-read" aria-live="polite">Select a line to read its wavelength.</div>`;$(id).firstChild.onclick=e=>{let rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*720,w=min+(x-L)/660*(max-min);if(w<min||w>max)return;let nearest=lines.map(a=>typeof a==='number'?a:a.w).filter(a=>a>=min&&a<=max).sort((a,b)=>Math.abs(a-w)-Math.abs(b-w))[0],snap=nearest!==undefined&&Math.abs(nearest-w)<(max-min)*.018;$(id+'-read').textContent=(snap?'Line center: ':'Detector: ')+(snap?nearest:w).toFixed(4)+' nm';if(cfg.pick)cfg.pick(snap?nearest:w)};}
function apparatus(mode,gas){let src=mode==='emission'?names[gas]+' tube':'Hot dense lamp',middle=mode==='absorption'?'Cool '+names[gas]+' gas':'',s=title(`${src}, ${middle}, slit, diffraction grating and detector`);s+=`<circle cx="65" cy="65" r="24" fill="${mode==='emission'?'#df9cfb':'#ffdd9c'}"/><text x="65" y="114" text-anchor="middle">${src}</text>`;s+=`<path d="M92 65H350" stroke="#ffde9c" stroke-width="5"/>`;if(middle)s+=`<rect x="155" y="38" width="95" height="54" rx="10" fill="#264354" stroke="#7ee2d0"/><text x="202" y="68" text-anchor="middle">${middle}</text>`;s+=`<path d="M350 22v35m0 16v35" stroke="#c9d7e5" stroke-width="10"/><text x="350" y="130" text-anchor="middle">Slit</text><path d="M360 65H450" stroke="#ffde9c" stroke-width="3"/><rect x="450" y="28" width="13" height="74" fill="#a8bccd"/><text x="456" y="130" text-anchor="middle">Grating</text>`;[420,490,550,600,670].forEach((w,i)=>s+=`<path d="M463 65L650 ${25+i*19}" stroke="${color(w)}" stroke-width="2"/>`);s+=`<rect x="650" y="10" width="13" height="110" fill="#bfd4e5"/><text x="650" y="142" text-anchor="middle">Detector</text>`;return svg(s,720,160)}
function show(i){state.tab=i;save();$('nav').innerHTML=tabs.map((t,j)=>`<button data-tab="${j}" class="${j===i?'active':''}" ${j===i?'aria-current="page"':''}><small>${String(j+1).padStart(2,'0')}</small> &nbsp;${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(+b.dataset.tab));[instrument,stars,rv,transit,rotation,expansion,composition,binary,notebook][i]();bindNotes();$('pause').textContent=paused?'Resume animation':'Pause animation';$('pause').setAttribute('aria-pressed',String(paused))}
function instrument(){ $('main').innerHTML=intro(1,'A fingerprint in light','Compare the same gas in two geometries. Wavelength is the distance between wave crests; nanometers (nm) are billionths of a meter.')+`<div class="grid"><div><div class="card"><div class="row spread"><h3>Virtual spectroscope</h3><span class="badge">380–720 nm</span></div><div id="setup"></div><div class="row"><label>Setup ${select('mode',['continuous','emission','absorption'],state.mode)}</label><label>Gas ${select('gas',Object.keys(E),state.gas)}</label></div><div id="detector"></div><p id="geometry" class="callout"></p><label class="checkbox"><input id="zoom" type="checkbox" ${state.zoom?'checked':''}>Zoom to sodium doublet (587–592 nm)</label></div><div class="card"><h3>Line identification</h3><p>Generate an unknown gas. Compare its line positions with a reference, then identify it. A match needs several lines when available.</p><button class="primary" id="newUnknown">Load mystery tube</button> <button id="sandbox">Return to sandbox</button><p id="unknownLabel"></p><div id="unknownSpectrum"></div><label>Reference comparison ${select('reference',Object.keys(E),state.ref)}</label><div id="referenceSpectrum"></div><div class="row"><label>Your identification ${select('gasGuess',Object.keys(E),'H')}</label><button id="checkGas">Check match</button></div><div class="status" id="gasFeedback" role="status"></div></div></div><div><div class="card"><h3>Read the fingerprint</h3><p><b>Continuous:</b> a hot, dense source produces a smooth range of wavelengths.</p><p><b>Emission:</b> excited, low-density gas produces bright lines.</p><p><b>Absorption:</b> cooler gas in front of a hotter background source removes light at specific wavelengths.</p><p>Transitions between atomic energy levels set the wavelengths. The same transitions can absorb and emit.</p><div class="callout caution">Line positions match; line strengths need not. Real absorption depends on temperature, ionization, level populations and viewing geometry. This sandbox forces matching transitions for comparison.</div></div><div class="card"><h3>Reference library</h3><div id="lineTable"></div><p class="muted">Selected neutral-atom visible lines; rounded air wavelengths from NIST. Not a complete line list. Widths and strengths are schematic.</p></div></div></div>`+note('foundation','Explain how you can tell that an emission tube and an absorbing gas contain the same element. Include at least two wavelengths.');
function draw(){ $('setup').innerHTML=apparatus(state.mode,state.gas);spectrum('detector',state.mode==='continuous'?[]:E[state.gas],state.mode,{...(state.zoom?{min:587,max:592}:{}),label:'Sandbox detector'});$('geometry').textContent=state.mode==='continuous'?'Lamp → slit → grating → detector: a continuous spectrum.':state.mode==='emission'?'Excited gas → slit → grating → detector: bright lines on a dark background.':'Lamp → cooler gas → slit → grating → detector: dark lines in a continuous spectrum.';let keys=Object.keys(E),u=keys[state.unknown];$('unknownLabel').textContent=state.mystery?'Mystery tube '+(state.unknown+1)+' • identity hidden':'Sandbox comparison: '+names[state.gas];spectrum('unknownSpectrum',E[state.mystery?u:state.gas],'emission',state.zoom?{min:587,max:592}:{});spectrum('referenceSpectrum',E[state.ref],'emission',state.zoom?{min:587,max:592}:{});$('lineTable').innerHTML=`<p><b>${names[state.ref]}</b> (${state.ref})</p><p class="readout">${E[state.ref].map(w=>w.toFixed(2)).join(' · ')} nm</p>`}
$('mode').onchange=e=>{state.mode=e.target.value;save();draw()};$('gas').onchange=e=>{state.gas=e.target.value;save();draw()};$('reference').onchange=e=>{state.ref=e.target.value;save();draw()};$('zoom').onchange=e=>{state.zoom=e.target.checked;save();draw()};$('newUnknown').onclick=()=>{state.unknown=(state.unknown+1)%5;state.mystery=true;state.zoom=false;$('zoom').checked=false;$('gasFeedback').textContent='';save();draw()};$('sandbox').onclick=()=>{state.mystery=false;save();draw()};$('checkGas').onclick=()=>{let correct=$('gasGuess').value===(state.mystery?Object.keys(E)[state.unknown]:state.gas);$('gasFeedback').textContent=correct?'Match confirmed. Record the wavelengths that support your identification.':'Compare all the line positions. A single nearby line is not enough.';if(correct)record('Spectrometer','Identified '+names[$('gasGuess').value]);};draw()}
const classes=['O','B','A','F','G','K','M'],temps=[35000,18000,9000,6800,5600,4400,3200];
const starData=[['S01',2,9000,25],['S02',5,4400,220],['S03',1,18000,.012],['S04',6,3200,.015],['S05',4,5600,1],['S06',0,35000,80000],['S07',3,6800,3],['S08',5,4400,.25],['S09',1,18000,1000],['S10',2,9000,.002],['S11',6,3200,900],['S12',4,5600,90],['S13',3,6800,.001],['S14',2,8000,9]];
function starLines(k){let H=[.24,.52,.95,.66,.37,.17,.07][k],He=[.15,.85,.08,0,0,0,0][k],metal=[.04,.07,.13,.42,.65,.88,.75][k],a=E.H.map(w=>({w,d:H,width:3+H*2}));a.push(...[447.15,587.56,667.82].map(w=>({w,d:He,width:2.5})),{w:454.2,d:k===0?.85:0,width:3},{w:468.6,d:k===0?.9:0,width:3},...[393.37,396.85,422.67,517.27,589.3].map(w=>({w,d:metal,width:3})));if(k===6)a.push(...[615,665,705].map(w=>({w,d:.7,width:20})));return a}
function stars(){$('main').innerHTML=intro(2,'Read a star’s temperature','Spectral class describes temperature and line patterns. Luminosity is total power output, measured here relative to the Sun (L☉).')+`<div class="grid"><div><div class="card"><h3>Thermal light & Wien’s law</h3>${range('temp','Surface temperature',2500,40000,100,state.T,' K')}<div class="row"><div id="starColor" class="starball" aria-label="Approximate star color"></div><p id="peak" class="readout"></p></div><div id="blackbody"></div><small>Planck curve per unit wavelength, normalized to its own peak. Only the shape is compared; hotter equal-area surfaces emit more total power. Visible range ≈380–750 nm.</small></div><div class="card"><h3>Mystery star <span id="starID"></span></h3><div class="row"><button id="prevStar">Previous</button><button id="nextStar">Next star</button><span id="lum"></span></div><div id="starSpectrum"></div><div class="row"><label>Class ${select('classGuess',classes,'A')}</label><button id="classify" class="primary">Classify & plot</button></div><div class="status" id="classFeedback" role="status"></div><label>Compare reference ${select('classRef',classes,'A')}</label><div id="classReference"></div></div></div><div><div class="card"><h3>Class reference</h3><table><thead><tr><th>Class / typical T</th><th>Diagnostic features</th></tr></thead><tbody>${classes.map((c,i)=>`<tr><td>${c} · ${temps[i].toLocaleString()} K</td><td>${['Ionized helium (454, 469 nm)','Neutral helium (447, 588, 668 nm)','Strongest hydrogen Balmer lines','Hydrogen plus stronger metal lines','Prominent calcium and metals','Strong neutral metals; weak H','Broad molecular bands (TiO)'][i]}</td></tr>`).join('')}</tbody></table><small>Representative patterns, not precise class boundaries. “Metals” in astronomy means elements heavier than helium. Luminosity also affects line profiles; this simplified classifier uses temperature patterns only.</small></div><div class="card"><h3>Why hydrogen lines vary</h3><div id="excitation"></div><p>Balmer absorption requires a neutral hydrogen atom with its electron in level n = 2.</p><p>In cool stars, few atoms occupy that excited level. Near A-star temperatures, more can absorb Balmer light. In very hot stars, ionization removes electrons from many hydrogen atoms.</p><div class="callout">A weak hydrogen line does not necessarily mean little hydrogen. Line strength also depends on the atoms’ physical state.</div></div></div><div class="card full"><div class="row spread"><h3>Your H–R diagram</h3><span id="starCount" class="badge"></span></div><div id="hr"></div><small>Temperature decreases to the right. Luminosity uses a logarithmic scale: equal vertical steps represent equal factors. Luminosities are supplied independently; spectra alone do not determine these values.</small><label class="checkbox"><input type="checkbox" id="regions">Show main sequence, giants and white dwarf regions</label><div id="regionsText" class="muted hidden">Main sequence: diagonal from hot/luminous to cool/faint. Giants: cool and luminous. White dwarfs: hot and faint. Stars with the same temperature can have different luminosities because their radii differ.</div></div></div>`+note('stars','Use your plotted stars to explain why temperature alone cannot tell you a star’s luminosity. Also explain why A stars show stronger hydrogen lines than both O and M stars.');
function thermal(){let T=state.T,p=2897772/T,plan=w=>1/(w**5*Math.expm1(1.438777e7/(w*T))),peakval=plan(p);plot('blackbody',[{points:samples(w=>plan(w)/peakval,50,2000,400)}],0,2000,0,1.05,'Wavelength (nm)','Relative intensity','',[ [p,1,'Peak'] ]);$('peak').textContent=`λpeak = 2,897,772 / T = ${p.toFixed(0)} nm`;let k=state.T>30000?0:state.T>10000?1:state.T>7500?2:state.T>6000?3:state.T>5200?4:state.T>3700?5:6;$('starColor').style.background=['#b9d2ff','#d5e2ff','#f0f1ff','#fff6ec','#fff1d9','#ffdab4','#ffc194'][k];$('starColor').title='Approximate integrated visible color; display dependent';let lineStrength=T=>Math.exp(-Math.pow(Math.log(T/9000)/.55,2));plot('excitation',[{points:samples(lineStrength,2500,40000)}],2500,40000,0,1.1,'Temperature (K)','Balmer strength (model)','',[[T,lineStrength(T),'T']])}
function target(){let s=starData[state.star];$('starID').textContent=s[0];$('lum').textContent='Luminosity: '+s[3]+' L☉';spectrum('starSpectrum',starLines(s[1]),'absorption');$('classFeedback').textContent=state.classified.includes(state.star)?'Already plotted. Compare its luminosity with other stars of the same class.':''}
function hr(){let points=state.classified.map(i=>{let s=starData[i];return [Math.log10(s[2]),Math.log10(s[3]),s[0]]});plot('hr',[],Math.log10(40000),Math.log10(2500),-4,6,'log₁₀ Temperature (K) · hot ← → cool','log₁₀ Luminosity (L☉)','',points);$('starCount').textContent=state.classified.length+' / 14 stars plotted'}
bindRange('temp','T',thermal,' K');$('classRef').onchange=()=>spectrum('classReference',starLines(classes.indexOf($('classRef').value)));$('prevStar').onclick=()=>{state.star=(state.star+13)%14;save();target()};$('nextStar').onclick=()=>{state.star=(state.star+1)%14;save();target()};$('classify').onclick=()=>{let s=starData[state.star];if($('classGuess').value!==classes[s[1]]){$('classFeedback').textContent='Compare Balmer, helium, metal and molecular features with the references.';return}if(!state.classified.includes(state.star)){state.classified.push(state.star);record('Stars',`${s[0]}: ${classes[s[1]]}, T=${s[2]} K, L=${s[3]} L☉`)}$('classFeedback').textContent='Class confirmed: '+classes[s[1]]+' · '+s[2]+' K. Plotted on your diagram.';hr()};$('regions').onchange=e=>$('regionsText').classList.toggle('hidden',!e.target.checked);thermal();target();hr();spectrum('classReference',starLines(2))}
function orbital(){let m=state.mass/1047.35,P=Math.sqrt(state.a**3/(1+m)),K=28.4329*state.mass*Math.pow(P,-1/3)*Math.pow(1+m,-2/3)*Math.sin(rad(state.inc));return {m,P,K}}
function rv(){$('main').innerHTML=intro(3,'Find an unseen planet','A star and planet both orbit their common center of mass, the barycenter. Radial velocity is the component of motion toward or away from us.')+`<div class="grid"><div><div class="card"><div class="row spread"><h3>One Sun-like star + one planet</h3><span class="badge">Circular orbit • 1 M☉ host</span></div><div id="orbit"></div><div id="rvSpec"></div><div id="rvNow" class="readout"></div><small>H-alpha rest wavelength: 656.2800 nm. Spectrum uses the calculated shift, with a very narrow wavelength window. Star wobble enlarged ×100; sizes schematic. Positive velocity = receding.</small></div><div class="card"><h3>Velocity curve</h3><div id="rvCurve"></div><div class="row"><label>Estimated period (days) <input id="periodGuess" type="number" min=".01" step=".1"></label><label>Estimated minimum mass (M♃) <input id="massGuess" type="number" min="0" step=".01"></label><button id="checkRV" class="primary">Check & record</button></div><div class="status" id="rvFeedback" role="status"></div></div></div><div><div class="card"><h3>Change the system</h3>${range('mass','Planet mass',.1,10,.1,state.mass,' M♃')}${range('a','Orbital separation',.05,3,.05,state.a,' AU')}${range('inc','Inclination',0,90,1,state.inc,'°')}<div id="rvStats" class="row"></div><details><summary>Calculation tools</summary><p>P² = a³ / (M★ + Mplanet), with years, AU and solar masses.</p><p>For a low-mass planet around a 1 M☉ star in a circular orbit:<br>m sin i ≈ (K / 28.43 m/s) × (P / years)<sup>1/3</sup> M♃.</p><p>K is half the peak-to-peak velocity range. The plotted model includes the small planet contribution to total mass.</p></details></div><div class="card"><h3>Inclination challenge</h3><p>Set 1 M♃ at 90°. Then try 2 M♃ at about 30°. Compare K at the same orbital separation.</p><p><b>90°</b> means edge-on: full radial motion. <b>0°</b> means face-on: no radial signal.</p><div class="callout">Radial velocity measures approximately m sin i. Since sin i ≤ 1, this is a minimum mass. A more massive planet at a smaller inclination can produce the same signal.</div><small>Orbital phase runs at a fixed classroom animation rate. Read physical time from the graph; animation speed is not real elapsed time.</small></div></div></div>`+note('rv','Describe two systems with similar velocity amplitudes but different true planet masses. Explain what extra information would help determine the true mass.');
function draw(){let {P,K}=orbital();$('rvStats').innerHTML=`<div class="stat"><small>Velocity amplitude K</small><strong>${K.toFixed(2)} m/s</strong></div><div class="stat"><small>Minimum mass m sin i</small><strong>${(state.mass*Math.sin(rad(state.inc))).toFixed(3)} M♃</strong></div>`;plot('rvCurve',[{points:samples(t=>K*Math.sin(TAU*t/(P*365.25)),0,P*365.25*2)}],0,P*365.25*2,-Math.max(1,K*1.15),Math.max(1,K*1.15),'Time (days)','Radial velocity (m/s)');rvFrame()}
['mass','a','inc'].forEach(id=>bindRange(id,id,draw,id==='inc'?'°':id==='a'?' AU':' M♃'));$('checkRV').onclick=()=>{if(state.inc===0){$('rvFeedback').textContent='No radial velocity signal: the period and minimum mass cannot be inferred from this flat curve.';return}let {P,K}=orbital(),pg=+$('periodGuess').value,mg=+$('massGuess').value,min=state.mass*Math.sin(rad(state.inc));if(!Number.isFinite(pg)||pg<=0||!$('massGuess').value||mg<0){$('rvFeedback').textContent='Enter a positive period and a nonnegative mass.';return}let ok=Math.abs(pg/(P*365.25)-1)<.1&&Math.abs(mg-min)<Math.max(.03,min*.1);$('rvFeedback').textContent=ok?'Consistent with the curve (within 10%). Estimates recorded.':'Use the spacing between peaks for P and the amplitude for K. Check days versus years.';if(ok)record('Radial velocity',`P estimate=${pg} days; minimum mass estimate=${mg} M♃; true mass=${state.mass} M♃, i=${state.inc}°, a=${state.a} AU`)};draw()}
function rvFrame(){if(!$('orbit'))return;let {m,P,K}=orbital(),f=phase,v=K*Math.sin(f),proj=Math.cos(rad(state.inc)),amp=80*m/(1+m)*100,xs=360-amp*Math.sin(f),ys=100+amp*Math.cos(f)*proj,xp=360+80*Math.sin(f),yp=100-80*Math.cos(f)*proj;let s=title('Projected star and planet orbit around a marked barycenter');s+=`<ellipse cx="360" cy="100" rx="80" ry="${Math.max(1,80*proj)}" fill="none" stroke="#42536d"/><path d="M355 100h10m-5 -5v10" stroke="#7ee2d0"/><circle cx="${xs}" cy="${ys}" r="22" fill="#ffda9a"/><circle cx="${xp}" cy="${yp}" r="9" fill="#8cc7df"/><text x="25" y="25">Sky projection · observer looks into screen</text><text x="25" y="190">+ marks barycenter; stellar displacement enlarged ×100</text>`;$('orbit').innerHTML=svg(s,720,210);let dw=Math.max(.00015,656.28*(K/1000)/C*1.8);spectrum('rvSpec',[656.28*(1+v/1000/C)],'absorption',{min:656.28-dw,max:656.28+dw});$('rvNow').textContent=`v = ${v.toFixed(2)} m/s · λ = ${(656.28*(1+v/1000/C)).toFixed(6)} nm · ${v>0?'receding':v<0?'approaching':'no radial motion'}`}
const molecules={Water:[[1.4,.10],[1.9,.12],[2.7,.16]],Sodium:[[.589,.025]],Methane:[[1.7,.08],[2.3,.1],[3.3,.15]],'Carbon dioxide':[[2.0,.09],[2.8,.08],[4.3,.17]]},atmospheres=[['Water','Sodium'],['Methane'],['Water','Carbon dioxide'],[]];
function circleOverlap(z,r){if(z>=1+r)return 0;if(z<=1-r)return Math.PI*r*r;if(z===0)return Math.PI*r*r;let a=Math.acos(Math.max(-1,Math.min(1,(z*z+r*r-1)/(2*z*r)))),b=Math.acos(Math.max(-1,Math.min(1,(z*z+1-r*r)/(2*z))));return r*r*a+b-.5*Math.sqrt(Math.max(0,(-z+r+1)*(z+r-1)*(z-r+1)*(z+r+1)))}
function transitFlux(t){let b=10*Math.cos(rad(state.ti)),x=t*5;return 1-circleOverlap(Math.hypot(b,x),state.rp)/Math.PI}
function transit(){$('main').innerHTML=intro(4,'A planet crosses its star','A transit is a planet passing in front of its star. Transmission spectroscopy measures how transit depth changes with wavelength as starlight passes through the atmosphere.')+`<div class="grid"><div><div class="card"><h3>Build a light curve</h3><div id="transitView"></div><div id="lightCurve"></div><div id="transitStats" class="readout"></div><small>Uniform-brightness star; circular orbit with separation 10 stellar radii. The plotted event uses a straight path across the stellar disk; limb darkening and orbital curvature during the event are omitted.</small></div><div class="card"><h3>Mystery atmosphere</h3><div class="row"><label>Planet ${select('atmos',[0,1,2,3],state.atmos)}</label><span class="badge">Synthetic, not JWST data</span></div><div id="transmission"></div><p>Higher transit depth means more light blocked. Identify gases from multiple features, compared with the reference list.</p><div id="moleculeGuess"></div><button id="checkAtmos" class="primary">Check composition</button><div class="status" id="atmosFeedback" role="status"></div></div></div><div><div class="card"><h3>Transit geometry</h3>${range('rp','Planet / star radius',.03,.2,.01,state.rp)}${range('ti','Inclination',80,90,.1,state.ti,'°')}<div class="callout">For a fully overlapping planet, depth ≈ (Rplanet / Rstar)². A larger planet makes a deeper dip. A tilted orbit can miss the star entirely.</div><p>At inclination 90°, the orbit is edge-on. Impact parameter b = 10 cos i is the projected mid-transit separation in stellar radii.</p></div><div class="card"><h3>Atmosphere reference</h3><table><thead><tr><th>Gas</th><th>Selected bands (µm)</th></tr></thead><tbody>${Object.entries(molecules).map(([m,a])=>`<tr><td>${m}</td><td>${a.map(p=>p[0]).join(', ')}</td></tr>`).join('')}</tbody></table><p class="muted">1 µm = 1,000 nm. Infrared wavelengths have no visible color. Real molecular bands are complex and overlap; these idealized features are illustrative, not a retrieval model.</p><p>Planet 3 is a flat-spectrum case. Clouds, haze, or weak atmospheric signals can hide gases, so no visible feature does not prove an atmosphere is absent.</p><label>Reference gas ${select('molRef',Object.keys(molecules),'Water')}</label><div id="moleculeReference"></div></div></div></div>`+note('transit','Compare two radius settings and their transit depths. Identify the mystery atmosphere using specific wavelengths, and explain what a flat transmission spectrum does and does not tell you.');
$('moleculeGuess').innerHTML=Object.keys(molecules).map(m=>`<label class="checkbox"><input type="checkbox" value="${m}" ${state.mol.includes(m)?'checked':''}>${m}</label>`).join('')+'<p class="muted">Leave all unchecked for no detectable features.</p>';
$('moleculeGuess').onchange=()=>{state.mol=[...$('moleculeGuess').querySelectorAll(':checked')].map(e=>e.value);save()};
function reference(){let mol=$('molRef').value;plot('moleculeReference',[{points:samples(w=>molecules[mol].reduce((s,[p,wd])=>s+.6*Math.exp(-.5*((w-p)/wd)**2),0),.4,5,500)}],.4,5,0,1,'Wavelength (µm)','Relative absorption')}
function draw(){plot('lightCurve',[{points:samples(transitFlux,-.4,.4,250)}],-.4,.4,.95,1.002,'Time from conjunction (days)','Relative brightness');let b=10*Math.cos(rad(state.ti)),depth=(1-transitFlux(0))*100;$('transitStats').textContent=`b = ${b.toFixed(2)} R★ · mid-event depth = ${depth.toFixed(3)}%${b>=1+state.rp?' · no transit':''}`;let base=state.rp**2*100;if(b>=1+state.rp){$('transmission').innerHTML='<p class="callout caution">No transit at this inclination: no transmission spectrum can be measured. Move the orbit closer to edge-on.</p>';$('checkAtmos').disabled=true;}else{$('checkAtmos').disabled=false;plot('transmission',[{points:samples(w=>base+atmospheres[state.atmos].reduce((s,m)=>s+molecules[m].reduce((q,[p,wd])=>q+.18*Math.exp(-.5*((w-p)/wd)**2),0),0),.4,5,600)}],.4,5,0,4.7,'Wavelength (µm)','Transit depth (%)');$('transmission').insertAdjacentHTML('beforeend','<small>Ideal full-transit atmosphere template; feature amplitudes are schematic and omit grazing geometry.</small>')}transitFrame()}
['rp','ti'].forEach(id=>bindRange(id,id,draw,id==='ti'?'°':''));$('atmos').onchange=e=>{state.atmos=+e.target.value;$('atmosFeedback').textContent='';save();draw()};$('molRef').onchange=reference;$('checkAtmos').onclick=()=>{let actual=atmospheres[state.atmos],ok=state.mol.length===actual.length&&actual.every(m=>state.mol.includes(m));$('atmosFeedback').textContent=ok?'Consistent with the synthetic features. Evidence recorded.':'Compare all peaks with the reference bands. Consider more than one gas.';if(ok)record('Transmission',`Planet ${state.atmos}: ${actual.join(' + ')||'flat; no detectable features'}; radius ratio ${state.rp}`)};draw();reference()}
function transitFrame(){if(!$('transitView'))return;let t=(phase/TAU%1)*.8-.4,b=10*Math.cos(rad(state.ti)),x=360+t*5*65,y=100+b*65;$('transitView').innerHTML=svg(title('Planet silhouette following a projected transit path')+`<circle cx="360" cy="100" r="65" fill="#ffdb99"/><path d="M200 ${y}H520" stroke="#50617b" stroke-dasharray="5 5"/><circle cx="${x}" cy="${y}" r="${65*state.rp}" fill="#121d30" stroke="#90acba"/><text x="25" y="25">Projected path · equal spatial scale</text><text x="25" y="190">Phase time ${t.toFixed(2)} d · relative flux ${transitFlux(t).toFixed(4)}</text>`,720,210)}
const vVisible=r=>200*r/Math.sqrt(8+r**3),vHalo=r=>180*r/Math.sqrt(r*r+16),vObserved=r=>Math.hypot(vVisible(r),vHalo(r));
function rotation(){$('main').innerHTML=intro(5,'Weigh a galaxy with light','Measure H-alpha along a tilted disk’s major axis. Subtract the systemic velocity, then correct for inclination to recover rotation speed. This model galaxy has systemic velocity zero and inclination 60°.')+`<div class="grid"><div><div class="card"><h3>Predict before observing</h3><p>Click the graph to sketch at least two points, or add them using the fields. Predict speed with increasing radius from visible mass alone, then commit to reveal the observations.</p><div id="prediction"></div><div class="row"><label>Radius (kpc) <input id="predR" type="number" min="1" max="24" value="4"></label><label>Speed (km/s) <input id="predV" type="number" min="0" max="300" value="100"></label><button id="addPrediction">Add point</button><button id="clearPrediction">Clear prediction</button><button id="reveal" class="primary">Commit & reveal</button></div><div id="predictFeedback" class="status" role="status"></div></div><div id="rotationLab" class="${state.reveal?'':'hidden'}"><div class="card"><h3>Doppler map</h3><div id="disk"></div><div class="row"><label>Side ${select('side',['1','-1'],state.side)}</label><label>Radius ${select('radius',[2,4,6,8,12,16,20,24],state.radius)} kpc</label></div><small>Side +1 = receding, side −1 = approaching. Colored halves indicate velocity direction. Sample along the major axis; kpc = 1,000 parsecs.</small><div id="diskSpectrum"></div><div class="row"><label>Measured λ (nm) <input id="rotationLambda" type="number" step=".0001"></label><button id="measureRotation" class="primary">Calculate & plot</button></div><div id="rotationFeedback" class="status" role="status"></div></div><div class="card"><h3>Your rotation curve</h3><div id="rotationCurve"></div><p class="muted">Gold: measurements · teal dashed: visible mass · violet: visible + halo · gray: your prediction.</p><div id="rotationTable" class="scroll"></div></div></div></div><div><div class="card"><h3>What the spectrum measures</h3><p>Rest wavelength λ₀ = 656.2800 nm.</p><p>v<sub>LOS</sub> = c(λ − λ₀)/λ₀<br>v<sub>rotation</sub> = |v<sub>LOS</sub>| / sin 60°<br>c = 299,792.458 km/s.</p><p>Line-of-sight velocity is motion toward or away from the observer. Along the major axis, inclination is the only projection correction in this idealized disk.</p><div class="callout">For orbits outside a centrally concentrated mass, v ∝ 1/√r. Extended unseen mass can keep speeds high at large radii.</div></div><div class="card"><h3>Add an invisible halo</h3><div id="haloControl" class="${state.reveal?'':'hidden'}">${range('halo','Halo strength',0,2,.05,state.halo)}<div id="haloFit" class="readout"></div><p>A halo is a roughly spherical distribution of mass around the galaxy. The slider scales the halo’s enclosed mass, not its light.</p><details><summary>Model details</summary><p>vvisible = 200r / √(8 + r³); vhalo = 180r / √(r² + 16), in km/s with r in kpc. Total v² = vvisible² + h vhalo². These are illustrative profiles, not a fit to a real galaxy.</p></details><button id="recordHalo">Record halo fit</button></div><p id="haloLocked" class="${state.reveal?'hidden':''}">Commit a prediction to unlock observations and the mass model.</p></div></div></div>`+note('rotation','Describe the trend in your measured velocities. Compare it with your visible-mass prediction and explain how adding a halo changes the fit.');
function prediction(){plot('prediction',[{points:[...state.pred].sort((a,b)=>a[0]-b[0]),color:'#a7b8ca'}],0,24,0,300,'Radius (kpc)','Predicted speed (km/s)');$('prediction').firstChild.onclick=e=>{if(state.reveal)return;let r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*280/r.height,rr=(x-70)/630*24,v=(225-y)/200*300;if(rr>=1&&rr<=24&&v>=0&&v<=300){state.pred.push([+rr.toFixed(1),+v.toFixed(0)]);save();prediction()}};$('reveal').disabled=state.pred.length<2||state.reveal;$('addPrediction').disabled=state.reveal;$('clearPrediction').disabled=state.reveal}
function draw(){let r=state.radius,side=+state.side,w=656.28*(1+side*vObserved(r)*Math.sin(rad(60))/C),s=title('Tilted disk with approaching left half and receding right half');s+=`<ellipse cx="360" cy="100" rx="285" ry="82" fill="#2c2641" stroke="#7d6c9d"/><path d="M360 18 A285 82 0 0 0 360 182Z" fill="#33668a"/><path d="M360 18 A285 82 0 0 1 360 182Z" fill="#87485c"/><circle cx="360" cy="100" r="15" fill="#ffdcaa"/>`;[2,4,6,8,12,16,20,24].forEach(rr=>{[-1,1].forEach(si=>s+=`<circle cx="${360+si*rr/24*275}" cy="100" r="${rr===r&&si===side?7:3}" fill="${rr===r&&si===side?'#fff':'#abc1da'}"/>`)});s+=`<text x="130" y="40">Approaching −</text><text x="485" y="40">Receding +</text>`;$('disk').innerHTML=svg(s,720,205);spectrum('diskSpectrum',[w],'emission',{min:655.6,max:657,label:'H-alpha from selected disk position',pick:w=>$('rotationLambda').value=w.toFixed(4)});let lines=[{points:samples(vVisible,1,24),dash:true},{points:samples(x=>Math.hypot(vVisible(x),Math.sqrt(state.halo)*vHalo(x)),1,24),color:'#bba5ff'},{points:[...state.pred].sort((a,b)=>a[0]-b[0]),color:'#657892',dash:true}];plot('rotationCurve',lines,0,24,0,300,'Radius (kpc)','Rotation speed (km/s)','',state.rotation.map(p=>[p.r,p.v,'']));$('rotationTable').innerHTML='<table><tr><th>r (kpc)</th><th>λ (nm)</th><th>vLOS (km/s)</th><th>vrot (km/s)</th></tr>'+state.rotation.map(p=>`<tr><td>${p.r}</td><td>${p.w.toFixed(4)}</td><td>${p.los.toFixed(1)}</td><td>${p.v.toFixed(1)}</td></tr>`).join('')+'</table>';let rms=state.rotation.length?Math.sqrt(state.rotation.reduce((sum,p)=>sum+(p.v-Math.hypot(vVisible(p.r),Math.sqrt(state.halo)*vHalo(p.r)))**2,0)/state.rotation.length):null;$('haloFit').textContent=rms===null?'Collect measurements to compare a fit.':'RMS mismatch: '+rms.toFixed(1)+' km/s'}
$('addPrediction').onclick=()=>{let r=+$('predR').value,v=+$('predV').value;if(!Number.isFinite(r)||!Number.isFinite(v)||r<1||r>24||v<0||v>300){$('predictFeedback').textContent='Use radius 1–24 and speed 0–300.';return}state.pred.push([r,v]);save();prediction()};$('clearPrediction').onclick=()=>{state.pred=[];save();prediction()};$('reveal').onclick=()=>{if(state.pred.length<2)return;state.reveal=true;record('Galaxy prediction',JSON.stringify(state.pred));rotation()};['radius','side'].forEach(id=>$(id).onchange=e=>{state[id]=+e.target.value;$('rotationLambda').value='';save();draw()});$('measureRotation').onclick=()=>{let w=+$('rotationLambda').value;if(!w||w<655.6||w>657){$('rotationFeedback').textContent='Click the H-alpha line or enter a wavelength within the detector window.';return}let los=C*(w/656.28-1),v=Math.abs(los)/Math.sin(rad(60));if(Math.abs(v-vObserved(state.radius))>5||Math.sign(los)!==+state.side){$('rotationFeedback').textContent='Check the line center and chosen side; that wavelength does not match within 5 km/s.';return}let p={r:state.radius,w,los,v,side:+state.side};state.rotation=state.rotation.filter(a=>!(a.r===p.r&&a.side===p.side));state.rotation.push(p);record('Galaxy rotation',`r=${p.r} kpc, λ=${w} nm, vLOS=${los.toFixed(2)} km/s, vrot=${v.toFixed(2)} km/s`);$('rotationFeedback').textContent='Measurement plotted. Sample several radii on both sides.';draw()};bindRange('halo','halo',draw);$('recordHalo').onclick=()=>{if(state.rotation.length<3){$('haloFit').textContent='Collect at least three measurements first.';return}record('Halo fit',`Halo strength ${state.halo}; ${state.rotation.length} measurements`);$('haloFit').textContent+=' · recorded'};prediction();if(state.reveal)draw()}
const distances=[15,30,50,75,100,140],peculiar=[45,-90,110,-70,55,-50];
function expansion(){$('main').innerHTML=intro(6,'Measure an expanding universe','Match a known line across distant galaxies, calculate recession velocities, and build a Hubble diagram. Distance estimates are supplied independently.')+`<div class="grid"><div><div class="card"><h3>Distant galaxy spectrum</h3><label>Galaxy ${select('galaxy',distances.map((d,i)=>i),state.galaxy)}</label><p id="distance" class="readout"></p><div id="galSpectrum"></div><div class="row"><label>Observed H-alpha λ (nm) <input id="hubbleLambda" type="number" step=".001"></label><button id="addGalaxy" class="primary">Calculate & plot</button></div><div id="hubbleFeedback" class="status" role="status"></div></div><div class="card"><h3>Your Hubble diagram</h3><div id="hubblePlot"></div><div id="hubbleTable" class="scroll"></div><label class="control"><span>Your slope H₀ (km/s/Mpc)</span><input type="number" id="h0Guess" value="65" min="20" max="120"></label><button id="fitHubble">Compare slope & record</button><div id="h0Feedback" class="status" role="status"></div></div></div><div><div class="card"><h3>From wavelength to expansion</h3><p>Redshift z = (λobserved − λrest)/λrest.</p><p>For these nearby model galaxies, v ≈ cz. Hubble’s relation is v ≈ H₀d.</p><p>Use λrest = 656.2800 nm for H-alpha and c = 299,792.458 km/s.</p><p>H₀ is the slope of velocity versus distance. A megaparsec (Mpc) is one million parsecs, about 3.26 million light-years.</p><div class="callout">These galaxies have small added peculiar velocities: motion relative to the general expansion. A best-fit trend uses the whole sample rather than a single galaxy.</div><p class="muted">Synthetic low-redshift data. At large cosmological redshifts, v = cz is not a general recession-velocity law; distances also require a cosmological model.</p></div></div></div>`+note('expansion','Report your expansion-rate estimate with units and describe how you obtained it. Explain why individual galaxies may not fall exactly on one straight line.');
function target(){let i=state.galaxy,v=70*distances[i]+peculiar[i],z=v/C;$('distance').textContent=`Galaxy ${i} · distance ${distances[i]} Mpc`;$('hubbleLambda').value='';spectrum('galSpectrum',E.H.map(w=>w*(1+z)),'emission',{min:390,max:690,pick:w=>$('hubbleLambda').value=w.toFixed(4)});}
function draw(slope){plot('hubblePlot',slope?[{points:[[0,0],[150,slope*150]],dash:true}]:[],0,150,0,12000,'Distance (Mpc)','Recession velocity (km/s)','',state.hubble.map(p=>[p.d,p.v,'G'+p.i]));$('hubbleTable').innerHTML='<table><tr><th>Galaxy</th><th>d (Mpc)</th><th>λ (nm)</th><th>z</th><th>v (km/s)</th></tr>'+state.hubble.map(p=>`<tr><td>${p.i}</td><td>${p.d}</td><td>${p.w.toFixed(3)}</td><td>${p.z.toFixed(5)}</td><td>${p.v.toFixed(1)}</td></tr>`).join('')+'</table>'}
$('galaxy').onchange=e=>{state.galaxy=+e.target.value;save();target()};$('addGalaxy').onclick=()=>{let i=state.galaxy,w=+$('hubbleLambda').value,expected=656.28*(1+(70*distances[i]+peculiar[i])/C);if(!w||Math.abs(w-expected)>.03){$('hubbleFeedback').textContent='Select the shifted H-alpha line near the red end of the spectrum. Other hydrogen lines are not H-alpha.';return}let z=w/656.28-1,v=C*z;state.hubble=state.hubble.filter(p=>p.i!==i);state.hubble.push({i,d:distances[i],w,z,v});record('Expansion',`Galaxy ${i}, d=${distances[i]} Mpc, λ=${w} nm, z=${z.toFixed(6)}, v=${v.toFixed(1)} km/s`);$('hubbleFeedback').textContent='Galaxy plotted. Measure another distance.';draw()};$('fitHubble').onclick=()=>{if(state.hubble.length<3){$('h0Feedback').textContent='Measure at least three galaxies first.';return}let slope=+$('h0Guess').value;if(!Number.isFinite(slope)||slope<20||slope>120){$('h0Feedback').textContent='Enter a slope from 20 to 120.';return}let best=state.hubble.reduce((s,p)=>s+p.d*p.v,0)/state.hubble.reduce((s,p)=>s+p.d*p.d,0);draw(slope);$('h0Feedback').textContent=`Your slope: ${slope}. Best fit through origin: ${best.toFixed(2)} km/s/Mpc. Compare the line with your points.`;record('Hubble fit',`Student H₀=${slope}; best through-origin fit=${best.toFixed(2)} km/s/Mpc`)};target();draw()}
function composition(){$('main').innerHTML=intro(7,'Separate composition from motion','Line spacing identifies atoms, while a common fractional shift reveals motion. Compare a stellar absorption spectrum with a low-density nebula’s emission spectrum.')+`<div class="grid"><div><div class="card"><h3>A moving source</h3>${range('speed','Radial velocity',-300,300,5,state.speed,' km/s')}<label>Additional element ${select('motionGas',['He','Na','Hg','Ne'],state.motionGas)}</label><div id="motionSpectrum"></div><p>Star: hydrogen plus the selected element in absorption.</p><div id="nebulaSpectrum"></div><p>Nebula: the same selected transitions shown in emission.</p><small>This paired comparison is schematic. Real nebulae often include strong forbidden oxygen and nitrogen lines; temperature and excitation determine which lines are visible.</small></div><div class="card"><h3>Identify & measure</h3><div class="row"><label>Reference ${select('motionRef',Object.keys(E),'H')}</label></div><div id="motionReference"></div><p>Use H-alpha (rest 656.2800 nm) to measure the motion. Click the red hydrogen line above to fill the wavelength.</p><div class="row"><label>Observed λ (nm) <input id="motionLambda" type="number" step=".0001"></label><button id="measureMotion" class="primary">Calculate velocity</button></div><div id="motionResult" class="status" role="status"></div></div></div><div><div class="card"><h3>Emission or absorption</h3><p>An emission nebula is excited, low-density gas. Bright lines stand above a dark background.</p><p>A star’s hot, dense interior provides continuous light. Cooler outer gas absorbs specific wavelengths, creating dark lines.</p><div class="callout">Approaching → shorter wavelength → blueshift.<br>Receding → longer wavelength → redshift.</div><p>v ≈ c(λobserved/λrest − 1), for speeds much smaller than c.</p><p>All lines share the same fractional shift Δλ/λ, not the same shift in nanometers.</p></div></div></div>`+note('composition','Explain how the same gas produces bright lines in one setup and dark lines in the other. Support a motion measurement using rest wavelength, observed wavelength, velocity and direction.');
function draw(){let a=[...E.H,...E[state.motionGas]].map(w=>w*(1+state.speed/C));spectrum('motionSpectrum',a,'absorption',{pick:w=>$('motionLambda').value=w.toFixed(4)});spectrum('nebulaSpectrum',a,'emission');spectrum('motionReference',E[$('motionRef').value],'emission')}
bindRange('speed','speed',draw,' km/s');$('motionGas').onchange=e=>{state.motionGas=e.target.value;save();draw()};$('motionRef').onchange=draw;$('measureMotion').onclick=()=>{let w=+$('motionLambda').value,expect=656.28*(1+state.speed/C);if(!w||Math.abs(w-expect)>.025){$('motionResult').textContent='Measure the H-alpha line (near 656 nm). Check that you selected hydrogen rather than a neighboring element.';return}let v=C*(w/656.28-1),text=`λ=${w} nm → v=${v.toFixed(2)} km/s · ${Math.abs(v)<.1?'no measured radial motion':v>0?'receding':'approaching'}`;$('motionResult').textContent=text;record('Composition & motion',`H + ${state.motionGas}; `+text)};draw()}
function binary(){$('main').innerHTML=intro(8,'Two stars, two moving fingerprints','In a double-lined spectroscopic binary, both stars contribute visible spectral lines. Their opposite velocities split the lines, then bring them back together.')+`<div class="grid"><div><div class="card"><h3>Orbit & combined spectrum</h3><div id="binaryView"></div><div id="binarySpectrum"></div><div id="binaryNow" class="readout"></div><p>H-alpha λ₀ = 656.2800 nm. Both stars contribute one schematic absorption line; deeper at overlap.</p></div><div class="card"><h3>Two velocity curves</h3><div id="binaryCurve"></div><p class="muted">Teal: star A · gold: star B. Systemic velocity is zero. Phase is the fraction of one orbit.</p><button id="captureBinary" class="primary">Record current line separation</button><div id="binaryFeedback" class="status" role="status"></div></div></div><div><div class="card"><h3>Change the binary</h3>${range('binaryRatio','Mass ratio MB / MA',.2,1,.05,state.binaryRatio)}${range('binaryInc','Inclination',0,90,1,state.binaryInc,'°')}<p>Star A has mass 1 M☉. Relative orbital speed is fixed at 180 km/s; changing mass ratio adjusts the implied separation and period.</p><p>Momentum conservation gives MA KA = MB KB, so MB / MA = KA / KB.</p><div class="callout">The less massive star moves faster. Both velocity amplitudes scale with sin i. Face-on systems show no orbital line splitting.</div><small>Orbit sizes and stellar radii are schematic. This model omits eclipses, unequal brightness, rotation broadening and eccentricity.</small></div></div></div>`+note('binary','Record a large and a small line separation. Explain why the lines merge twice per orbit, and how the two velocity amplitudes reveal the mass ratio.');
function draw(){let q=state.binaryRatio,si=Math.sin(rad(state.binaryInc)),ka=180*q/(1+q)*si,kb=180/(1+q)*si;plot('binaryCurve',[{points:samples(t=>ka*Math.sin(t*TAU),0,2)},{points:samples(t=>-kb*Math.sin(t*TAU),0,2),color:'#ffce83'}],0,2,-160,160,'Orbital phase (cycles)','Velocity (km/s)');binaryFrame()}
['binaryRatio','binaryInc'].forEach(id=>bindRange(id,id,draw,id==='binaryInc'?'°':''));$('captureBinary').onclick=()=>{let q=state.binaryRatio,si=Math.sin(rad(state.binaryInc)),va=180*q/(1+q)*si*Math.sin(phase),vb=-180/(1+q)*si*Math.sin(phase),sep=656.28*Math.abs(va-vb)/C;let t=`Phase ${(phase/TAU%1).toFixed(3)}, Δλ=${sep.toFixed(4)} nm, vA=${va.toFixed(2)}, vB=${vb.toFixed(2)} km/s`;record('Binary',t);$('binaryFeedback').textContent=t};draw()}
function binaryFrame(){if(!$('binaryView'))return;let q=state.binaryRatio,si=Math.sin(rad(state.binaryInc)),co=Math.cos(rad(state.binaryInc)),va=180*q/(1+q)*si*Math.sin(phase),vb=-180/(1+q)*si*Math.sin(phase),ra=95*q/(1+q),rb=95/(1+q),s=title('Binary stars on opposite sides of the barycenter');s+=`<ellipse cx="360" cy="95" rx="${ra}" ry="${Math.max(1,ra*co)}" fill="none" stroke="#31515b"/><ellipse cx="360" cy="95" rx="${rb}" ry="${Math.max(1,rb*co)}" fill="none" stroke="#62543c"/><circle cx="${360-ra*Math.sin(phase)}" cy="${95+ra*Math.cos(phase)*co}" r="18" fill="#7ee2d0"/><circle cx="${360+rb*Math.sin(phase)}" cy="${95-rb*Math.cos(phase)*co}" r="15" fill="#ffce83"/><path d="M355 95h10m-5 -5v10" stroke="white"/><text x="20" y="25">Sky projection · + marks barycenter</text>`;$('binaryView').innerHTML=svg(s,720,190);spectrum('binarySpectrum',[{w:656.28*(1+va/C),d:.55,width:5},{w:656.28*(1+vb/C),d:.55,width:5}],'absorption',{min:655.9,max:656.66});$('binaryNow').textContent=`A: ${va.toFixed(1)} km/s · B: ${vb.toFixed(1)} km/s · separation: ${(656.28*Math.abs(va-vb)/C).toFixed(4)} nm`}

function notebook(){let labels={foundation:'Spectrometer',stars:'Stars & H–R diagram',rv:'Doppler planets',transit:'Transits & atmospheres',rotation:'Galaxy rotation',expansion:'Cosmic expansion',composition:'Composition & nebulae',binary:'Binary stars'};$('main').innerHTML=`<div class="intro"><div class="eyebrow">Your record of discovery</div><h2>Notebook & field guide</h2><p class="muted">Gather observations, explain the evidence, and export your work. This website does not submit work to Canvas automatically.</p></div><div class="card"><div class="row spread"><label>Student name <input type="text" id="student" maxlength="100" value="${esc(state.student)}" placeholder="Name / class period"></label><span class="badge">${state.log.length} recorded observations</span></div><div class="row noPrint" style="margin-top:16px"><button id="exportCSV" class="primary">Download notebook CSV</button><button id="exportJSON">Save full progress (JSON)</button><button id="importButton">Restore progress</button><input class="hidden" type="file" id="importJSON" accept=".json,application/json"><button id="print">Print notebook / save PDF</button></div><p id="saveStatus" class="muted">${storageOK?'Automatic saving is available in this browser.':'Automatic browser saving is unavailable. Export your work before closing.'} Full progress restores all measurements, controls and explanations. CSV is a readable submission record.</p><div id="importStatus" class="status" role="status"></div></div><div class="card"><h3>Recorded observations</h3><div class="scroll"><table><thead><tr><th>Lab</th><th>Evidence</th></tr></thead><tbody>${state.log.length?state.log.map(r=>`<tr><td>${esc(r.lab)}</td><td>${esc(r.text)}</td></tr>`).join(''):'<tr><td colspan="2">No measurements recorded yet. Use the check, calculate and record buttons in the labs.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Explanations</h3>${Object.entries(labels).map(([k,t])=>`<div style="margin-bottom:22px"><h3>${t}</h3><textarea aria-label="${t} explanation" data-note="${k}">${esc(state.notes[k]||'')}</textarea><div class="printOnly">${esc(state.notes[k]||'No explanation recorded.')}</div></div>`).join('')}</div><div class="card noPrint"><h3>Student route</h3><ol><li><b>Learn the instrument.</b> Compare emission and absorption for hydrogen and sodium. Identify two mystery tubes.</li><li><b>Classify stars.</b> Compare reference patterns, classify all 14 stars, and look for distinct H–R regions.</li><li><b>Find planets.</b> Estimate period and minimum mass for two systems. Test the inclination challenge.</li><li><b>Watch a transit.</b> Change planet radius and tilt. Identify the atmosphere of each synthetic planet.</li><li><b>Weigh a galaxy.</b> Commit a prediction, measure at least six radii, and adjust the halo to match the outer curve.</li><li><b>Measure expansion.</b> Plot all six galaxies and estimate H₀ from the trend.</li><li><b>Connect the evidence.</b> Compare nebula and stellar spectra, then examine line splitting in a binary.</li><li><b>Submit evidence.</b> Write explanations, export the CSV or print your notebook, and upload the result as your teacher directs.</li></ol></div><div class="card noPrint"><h3>Teacher / hosting notes</h3><p>This entire application is one HTML file. Open it directly in a modern browser, or host it on any static web server. It has no external assets and requires no installation or network access.</p><p>For Canvas, upload the HTML as a downloadable file and direct students to download it and open it in a browser. If your Canvas or district blocks HTML downloads, host the file on an approved site and link to it. A hosted version may be embedded in a Canvas iframe if local policy allows it. Test in your student environment first.</p><p>Students can export a CSV for submission, print the notebook to PDF, or save and restore full progress with JSON. Browser storage for local files varies by browser and may be cleared on managed devices; JSON is the portable backup. Progress remains separate on each browser/device. There are no accounts or automatic grading. Answers and model parameters are visible in source code, so use explanations and evidence for assessment.</p><p><b>Models and scope.</b> All astronomical spectra and observations are synthetic. Selected atomic wavelengths are based on NIST; line widths, strengths, star colors and molecular band profiles are simplified. No actual JWST observation is bundled. An internet link below offers an authentic comparison; it is optional and not needed to run any lab.</p><details><summary>Equations & model assumptions</summary><p>Thermal light uses Planck’s wavelength form and Wien’s constant 2.897772 × 10⁶ nm K. Stellar spectral classes use illustrative diagnostic patterns, not synthetic stellar atmosphere calculations.</p><p>Planet RV assumes a circular orbit and a 1 M☉ host. P² = a³/(1 + m), with m in solar masses. K = 28.4329 mplanet P<sup>−1/3</sup>(1+m)<sup>−2/3</sup> sin i m/s, with mplanet in Jupiter masses and P in years. M☉/M♃ = 1047.35. The low-mass estimate m sin i has a small total-mass approximation.</p><p>Transit photometry uses exact overlap area of two disks of uniform brightness along a straight path, with b = 10 cos i. Atmospheric peaks are idealized band templates with schematic amplitudes, shown for a full transit. They are not fitted molecular opacities or abundance measurements.</p><p>Rotation uses a fixed 60° inclination and synthetic visible and halo profiles. The halo-strength multiplier scales the halo contribution to v². Hubble data use H₀ = 70 km/s/Mpc plus fixed small peculiar velocities; student slope fits are through the origin.</p><p>The binary is circular with MA = 1 M☉ and relative speed 180 km/s. For mass ratio q, a = G M☉(1+q)/vrelative², and P = 2πa/vrelative. Spectral lines are schematic, with no attempt to infer luminosity from stellar mass.</p></details><details><summary>Source references (optional online reading)</summary><ul class="reference"><li><a href="https://physics.nist.gov/PhysRefData/Handbook/Tables/hydrogentable2.htm" target="_blank" rel="noopener">NIST selected hydrogen lines</a>; <a href="https://physics.nist.gov/PhysRefData/Handbook/Tables/heliumtable2.htm" target="_blank" rel="noopener">helium</a>; <a href="https://physics.nist.gov/PhysRefData/Handbook/Tables/sodiumtable2.htm" target="_blank" rel="noopener">sodium</a>; <a href="https://physics.nist.gov/PhysRefData/Handbook/Tables/neontable2.htm" target="_blank" rel="noopener">neon</a>; <a href="https://physics.nist.gov/PhysRefData/Handbook/Tables/mercurytable2.htm" target="_blank" rel="noopener">mercury</a>.</li><li><a href="https://exoplanetarchive.ipac.caltech.edu/docs/poet_calculations.html" target="_blank" rel="noopener">NASA Exoplanet Archive: observable calculations</a>.</li><li><a href="https://science.nasa.gov/asset/webb/warm-gas-giant-exoplanet-wasp-107-b-transmission-spectrum-nirspec/" target="_blank" rel="noopener">NASA / Webb: real WASP-107 b transmission spectrum</a> for optional comparison with the simulated atmosphere lab.</li><li><a href="https://www.nasa.gov/space-science-and-astrobiology-at-ames/interesting-fact-of-the-month-current/interesting-fact-of-the-month-2023/" target="_blank" rel="noopener">NASA: rotation curves and unseen mass</a>.</li></ul></details></div><div class="card noPrint"><h3>Start a new notebook</h3><p>Export anything you want to keep first. Reset removes the work on this browser.</p><button id="reset">Reset all progress…</button><div id="resetConfirm" class="hidden"><p>Clear this browser’s notebook, measurements and explanations?</p><button id="resetYes">Clear all work</button> <button id="resetNo">Keep my work</button></div></div>`;
